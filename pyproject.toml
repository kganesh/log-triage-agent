[project]
name = "logtriage"
version = "0.1.0"
description = "A LangChain agent that reads a log file and explains what went wrong"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-aws>=1.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7"]

[project.scripts]
logtriage = "logtriage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]
